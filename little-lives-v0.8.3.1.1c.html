<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#213b37" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Little Lives v0.8.3.1.1c — Crowd Lab Beta</title>
<style>
:root{--ink:#243734;--paper:#fff9e8;--border:#293d36;--gold:#ffd66e;--green:#8dc69a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#223b35;font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#game{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none;image-rendering:pixelated;cursor:grab}#game.dragging{cursor:grabbing}
/* The crowd test controls are completely separate from the production game UI. */
#crowdLab{position:fixed;z-index:7;right:8px;bottom:calc(env(safe-area-inset-bottom) + 76px);
 max-width:min(290px,calc(100vw - 16px));background:rgba(255,249,232,.97);
 color:#243734;border:2px solid #293d36;border-radius:10px;padding:7px 9px;
 box-shadow:0 4px 14px #192f2844;font:12px ui-rounded,system-ui,sans-serif;}
#crowdLabToggle{font-size:12px;font-weight:900;background:transparent;border:0;color:#243734;padding:3px 0;width:100%;text-align:left}
#crowdLabControls{padding-top:7px;border-top:1px solid #ccd8c7;margin-top:5px}
#crowdLabControls button{padding:5px 7px;background:#e6efd9;border:1px solid #789785;border-radius:5px;
 margin:1px;font-weight:800;color:#243734;font-size:12px}
#crowdLabControls button.selected{background:#ffcf64;border-color:#947844}
#crowdLabMetrics{font-size:11px;line-height:1.45;margin-top:6px;color:#425b4d}
#crowdLabMetrics .betaMetric{margin-top:5px;padding-top:5px;border-top:1px solid #cfdbca}
#crowdLabMetrics .betaMetric b{color:#2a4236}
#crowdLabMetrics .betaMetric small{font-weight:600}
#crowdLabControls small{display:block;font-size:10px;line-height:1.35;color:#6d7667;margin-top:5px}
#crowdLabActionRow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
#crowdLabActionRow button{flex:1 1 0;min-width:0}
#crowdLab.compact #crowdLabControls{display:none}
/* Hide the floating lab controls while a person/nuke sheet is open. The
   old Crowd Lab widget could intercept taps on the right side of the sheet. */
#sheet.show + #crowdLab{display:none}
#sheet[data-page="saves"]{max-height:min(63vh,520px)}
#sheet[data-page="saves"] .nukeButton{white-space:normal;line-height:1.3}
#sheet[data-page="saves"] .armedDesc{display:none;margin:10px 0 12px;padding:10px 12px;border:2px solid #d18479;border-radius:9px;background:#fff0eb;color:#6b2a23;font-size:12px;line-height:1.55}
#sheet[data-page="saves"] .armedDesc strong{display:block;margin-bottom:4px;color:#5a1e18}
#crowdLabNuke{background:#f3cfcc!important;border-color:#b84e43!important;color:#71251f!important;margin-top:0!important;display:block;width:auto;font-weight:900!important}
.nukeButton{background:#f3cfcc!important;color:#68221d!important;border-color:#a64c42!important;font-weight:900!important}
#vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 95px #0e292139}
.hud{position:absolute;z-index:3;background:var(--paper);border:3px solid var(--border);box-shadow:4px 5px 0 #1b34294c;border-radius:10px}
#header{top:calc(env(safe-area-inset-top) + 12px);left:12px;display:flex;align-items:center;gap:12px;padding:8px 12px;max-width:calc(100% - 180px)}
#header .brand{font-weight:1000;font-size:16px;white-space:nowrap;letter-spacing:-.6px}#header .brand span{color:#df794b}
#clock{font-size:12px;font-weight:800;color:#576c61;white-space:nowrap}#clock strong{color:#213b37;font-size:14px}
#minimapBox{top:calc(env(safe-area-inset-top) + 12px);right:12px;padding:5px;width:145px}#minimap{display:block;width:129px;height:94px;image-rendering:pixelated;cursor:crosshair;border:1px solid #9caf96;border-radius:3px;touch-action:manipulation}
#mapCaption{font-size:10px;text-align:center;font-weight:850;letter-spacing:1px;margin-top:4px;color:#637669}
#toolbar{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;align-items:center;gap:5px;padding:7px;max-width:calc(100vw - 20px)}
.pxbtn{border:2px solid var(--border);background:#fff7e3;border-radius:7px;min-height:39px;min-width:39px;padding:6px 10px;color:var(--ink);font-weight:900;font-size:13px;box-shadow:0 3px 0 #a4b4a6;white-space:nowrap}.pxbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #a4b4a6}.pxbtn.active{background:#ffcf64}.pxbtn.green{background:#a6d9aa}.pxbtn.small{min-width:32px;padding:5px 8px}
.sep{width:2px;background:#d0d8c8;height:28px;margin:0 2px}
#sceneTag{position:absolute;top:calc(env(safe-area-inset-top) + 129px);right:12px;z-index:2;background:#fff8e4e6;border:2px solid var(--border);padding:6px 9px;border-radius:7px;font-size:12px;font-weight:850;max-width:160px;text-align:center}
#hint{position:absolute;z-index:2;top:calc(env(safe-area-inset-top) + 74px);left:12px;background:#213e36cf;color:#fff9e8;font-size:12px;font-weight:750;border-radius:7px;padding:7px 10px;pointer-events:none;max-width:min(300px,52vw);transition:opacity .3s}
#notice{position:absolute;z-index:8;left:50%;top:calc(env(safe-area-inset-top) + 79px);transform:translateX(-50%);background:#fff8e8;border:2px solid var(--border);padding:8px 13px;border-radius:8px;max-width:85vw;font-size:12px;font-weight:850;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
/* Translucent startup save indicator; independent of the game's existing notices. */
#saveFlash{position:fixed;z-index:9;left:12px;top:calc(env(safe-area-inset-top) + 180px);
 max-width:min(276px,calc(100vw - 24px));padding:10px 13px;display:flex;gap:9px;align-items:flex-start;
 border:1px solid rgba(192,236,210,.38);border-radius:9px;
 background:rgba(28,75,64,.86);color:#f3fff7;
 box-shadow:0 8px 25px rgba(12,37,30,.19);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
 font-size:12px;line-height:1.4;font-weight:700;letter-spacing:.05px;
 opacity:0;pointer-events:none;will-change:opacity,transform;}
#saveFlash::before{content:'';flex:none;width:7px;height:7px;border-radius:50%;margin-top:5px;
 background:#a9e9c7;box-shadow:0 0 0 3px rgba(169,233,199,.12);}
#saveFlash.warning{background:rgba(85,68,41,.88);border-color:rgba(248,215,147,.42);color:#fff8e8;}
#saveFlash.warning::before{background:#f5d38e;box-shadow:0 0 0 3px rgba(245,211,142,.13);}
#saveFlash.visible{animation:saveFlashFade 5.5s ease-out both;}
@keyframes saveFlashFade{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:translateY(0)}62%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){#saveFlash.visible{animation:saveFlashFadeReduced 5.5s linear both;}@keyframes saveFlashFadeReduced{0%{opacity:0}8%,62%{opacity:1}100%{opacity:0}}}
#sheet{position:absolute;z-index:5;left:12px;bottom:calc(env(safe-area-inset-bottom) + 76px);width:min(360px,calc(100vw - 24px));max-height:min(58vh,510px);overflow:auto;background:var(--paper);border:3px solid var(--border);border-radius:12px;box-shadow:5px 6px 0 #1b34294c;padding:14px;display:none}#sheet.show{display:block}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}.sheethead h2{margin:0;font-size:19px;letter-spacing:-.5px}#sheet .sub{color:#637667;font-size:12px;font-weight:700;margin-bottom:12px}.xbtn{border:2px solid var(--border);background:#fff;border-radius:6px;font-size:18px;font-weight:900;width:33px;height:33px}
#sheet .action{background:#e6efdc;border:2px solid #aabb9d;padding:8px 10px;border-radius:7px;font-size:13px;font-weight:700;line-height:1.4;margin:8px 0}#sheet .actions{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 0}#sheet .actions .pxbtn{flex:1}
.stat{display:grid;grid-template-columns:62px 1fr 32px;align-items:center;gap:7px;font-size:11px;font-weight:800;margin:7px 0}.meter{height:11px;border:2px solid #819a8a;background:#d7ddca;overflow:hidden;border-radius:5px}.meter>i{display:block;height:100%;background:#6bae87}.meter.low>i{background:#e28b5c}
.chip{display:inline-block;padding:4px 7px;border-radius:6px;background:#e6ecdb;border:1px solid #c3ccb9;font-size:11px;font-weight:800;margin:2px 3px 3px 0}.rowline{padding:9px 2px;border-bottom:1px solid #d9dfcd;display:flex;justify-content:space-between;align-items:center;gap:10px}.rowline button{font-weight:850;text-align:left;border:0;background:transparent;padding:0;color:#274d43}.rowline small{color:#7b8a7e;font-size:11px;font-weight:700}
#sheet .sectiontitle{font-size:11px;color:#667d70;font-weight:950;letter-spacing:1px;margin-top:14px;margin-bottom:5px;text-transform:uppercase}
.activityRow{padding:10px 0;border-bottom:1px solid #d9dfcd;display:flex;align-items:center;gap:7px}
.activityCopy{flex:1;min-width:0}.activityCopy strong{display:block;font-size:12px;line-height:1.3}.activityCopy small{display:block;color:#718175;font-size:11px;line-height:1.4;margin-top:2px}
.activityBtns{display:flex;gap:4px}.activityBtns button{padding:5px 7px;min-height:32px;min-width:40px;font-size:11px}
.moodBadge{display:inline-block;background:#f5e4b9;border:1px solid #d2b682;border-radius:6px;font-weight:850;font-size:13px;padding:5px 8px;margin:4px 0}
/* Beta-only read-only state inspection. Never changes resident scheduling. */
.residentDiagnostic{margin-top:9px;border:1px solid #cedcc7;border-radius:8px;padding:8px 9px;background:#f4f4e9;font-size:11px;line-height:1.5}
.residentDiagnostic summary{cursor:pointer;font-weight:850;list-style-position:inside}
.residentDiagnostic dl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:3px 8px;margin:9px 0 1px}
.residentDiagnostic dt{color:#607469;font-weight:800}.residentDiagnostic dd{margin:0;overflow-wrap:anywhere}
.residentDelay{margin-top:8px;padding:7px 8px;background:#fff0d5;border-left:3px solid #c99a51;border-radius:4px;font-size:11px;font-weight:650}
.moodlet{padding:7px 0;border-bottom:1px solid #d9dfcd;font-size:12px;line-height:1.45}
#eventToast{position:absolute;z-index:2;left:12px;bottom:calc(env(safe-area-inset-bottom) + 82px);max-width:280px;padding:8px 12px;border-radius:8px;background:#28483ecb;color:#fff;box-shadow:0 2px 15px #18362955;font-size:12px;font-weight:750;pointer-events:none;transition:opacity .3s;opacity:.93}
@media(max-width:630px){#header{top:calc(env(safe-area-inset-top) + 8px);left:8px;max-width:calc(100% - 129px);padding:7px 8px;gap:6px;flex-wrap:wrap;row-gap:0}#header .brand{font-size:14px}#clock{font-size:10px}#clock strong{font-size:11px}#minimapBox{top:calc(env(safe-area-inset-top) + 8px);right:8px;width:115px;padding:4px}#minimap{width:101px;height:73px}#mapCaption{font-size:9px}#sceneTag{top:calc(env(safe-area-inset-top) + 103px);right:8px;font-size:11px;max-width:135px}#hint{top:calc(env(safe-area-inset-top) + 83px);left:8px;max-width:calc(100vw - 152px);font-size:10px}#toolbar{gap:2px;padding:4px;bottom:calc(env(safe-area-inset-bottom) + 8px)}.pxbtn{min-width:30px;min-height:35px;padding:5px 6px;font-size:11px}.pxbtn.small{min-width:29px;padding:5px 6px}.sep{margin:0 1px}#sheet{left:8px;bottom:calc(env(safe-area-inset-bottom) + 65px);width:calc(100vw - 16px);max-height:49vh}#eventToast{left:8px;bottom:calc(env(safe-area-inset-bottom) + 69px);max-width:min(300px,75vw);font-size:11px}}
@media(max-width:630px){#saveFlash{left:8px;top:calc(env(safe-area-inset-top) + 165px);max-width:min(255px,calc(100vw - 16px));font-size:11px;padding:9px 11px;}}
@media(max-height:460px){#saveFlash{top:calc(env(safe-area-inset-top) + 62px)}#minimapBox{display:none}#sceneTag{top:calc(env(safe-area-inset-top) + 13px);right:8px}#sheet{max-height:58vh}}
/* Keep every toolbar control tappable on smaller 320 px iPhones. */
@media(max-width:350px){#toolbar{gap:0;padding:3px}.pxbtn{min-width:25px;min-height:33px;padding:4px 3px;font-size:10px}.pxbtn.small{min-width:24px;padding:4px 3px}.sep{width:1px;margin:0}}

/* v0.8.3.1.1b: compact, full-width mobile toolbar with integrated Crowd Lab.
   Keep the original game controls and Crowd Lab logic; only reflow their UI. */
#toolbar{
  left:6px;right:6px;transform:none;max-width:none;bottom:calc(env(safe-area-inset-bottom) + 9px);
  display:flex;align-items:center;justify-content:space-between;gap:4px;
  padding:5px 6px;min-height:54px;overflow:visible;z-index:4;
}
#toolbar .sep{width:1px;height:24px;margin:0;flex:none;opacity:.6}
#toolbar > .pxbtn{flex:none;min-height:39px;height:39px;padding:5px 7px;border-radius:7px;line-height:1.1}
#toolbar #townBtn{background:#a9d8af}
#toolbar #play{background:#ffce67}
#toolbar #speed{background:#f6e3b7}
#toolbar #people{background:#deecfa}
#toolbar #events{background:#d8ece2}
#toolbar #nextMoment{background:#dfebf8}
#zoomStack{position:relative;display:flex;flex-direction:column;justify-content:center;gap:1px;
  flex:0 0 33px;width:33px;height:42px;transform:translateY(-5px);z-index:1}
#zoomStack .pxbtn{width:100%;height:23px;min-height:23px;min-width:0;padding:0 2px;
  font-size:16px;line-height:18px;background:#edf4ee;border-radius:6px;box-shadow:0 2px 0 #a4b4a6}
#crowdLab{position:relative;z-index:2;right:auto;bottom:auto;flex:1 1 117px;min-width:95px;max-width:none;
  height:39px;align-self:center;padding:0 0 0 7px;margin:0 0 0 1px;
  background:transparent;border:0;border-left:2px solid #cad8c9;border-radius:0;box-shadow:none;
  font:inherit;display:flex;align-items:center}
#crowdLabToggle{display:flex;flex-direction:column;justify-content:center;align-items:stretch;
  width:100%;min-width:0;height:38px;border:0;padding:1px 0;background:transparent;
  color:#243734;text-align:left;cursor:pointer;line-height:1.1}
#crowdLabToggle .labTop{display:flex;align-items:center;justify-content:space-between;gap:2px;
  width:100%;font-size:11px;font-weight:950;white-space:nowrap}
#crowdLabToggle .labCount{display:block;color:#456057;font-size:11px;font-weight:850;white-space:nowrap;margin-top:4px}
#crowdLabToggle .labChevron{color:#506c5e;font-size:11px}
#crowdLabControls{position:absolute;bottom:calc(100% + 13px);right:-5px;
  width:min(296px,calc(100vw - 22px));max-height:min(64vh,450px);overflow-y:auto;
  border:3px solid var(--border);border-radius:11px;background:rgba(255,249,232,.98);
  box-shadow:5px 6px 0 #1b34294c;padding:10px 11px;z-index:10;
  font-size:12px;line-height:1.4}
/* Explicit second way to collapse the expanded Crowd Lab panel. */
#crowdLabPanelHeader{display:flex;align-items:center;justify-content:space-between;
 gap:8px;position:sticky;top:-10px;z-index:3;margin:-4px -5px 7px;
 padding:4px 5px 7px;border-bottom:1px solid #cbd9c7;background:#fff9e8}
#crowdLabPanelHeader strong{font-size:12px;line-height:1.2}
#crowdLabControls #crowdLabCollapse{min-width:78px;min-height:34px;
 padding:5px 8px;margin:0;background:#e1f0df;border:2px solid #729786;
 border-radius:7px;font-size:12px;font-weight:900;touch-action:manipulation}
#crowdLabControls #crowdLabCollapse:focus-visible{outline:3px solid #306750;outline-offset:2px}
#crowdLabControls::after{content:'';position:absolute;right:23px;bottom:-9px;
  border-top:8px solid var(--border);border-left:9px solid transparent;border-right:9px solid transparent}
#crowdLab.compact #crowdLabControls{display:none}
body:has(#sheet.show) #crowdLab{visibility:hidden}
#toolbar #crowdLabActionRow{display:flex;gap:5px;align-items:stretch;flex-wrap:wrap}
#toolbar #crowdLabActionRow button{flex:1 1 105px;min-width:0;white-space:normal}
@media(max-width:630px){
 #toolbar{left:5px;right:5px;gap:3px;padding:4px 5px;bottom:calc(env(safe-area-inset-bottom) + 8px);min-height:52px}
 #toolbar > .pxbtn{height:35px;min-height:35px;min-width:0;padding:5px 5px;font-size:12px}
 #toolbar #townBtn{padding:5px 6px}
 #toolbar #events{padding:5px 4px}
 #zoomStack{flex-basis:30px;width:30px}
 #crowdLab{flex-basis:112px;min-width:94px;padding-left:6px;margin-left:1px}
 #crowdLabToggle .labTop{font-size:11px}
 #crowdLabToggle .labCount{font-size:11px}
}
@media(max-width:390px){
 #toolbar{gap:2px;padding:4px 4px}
 #toolbar > .pxbtn{font-size:11px;padding:4px 4px}
 #toolbar #townBtn{padding:4px 5px}
 #toolbar .sep{display:none}
 #zoomStack{flex-basis:28px;width:28px}
 #crowdLab{flex-basis:105px;min-width:85px;padding-left:5px}
 #crowdLabToggle .labTop{font-size:10.5px}
 #crowdLabToggle .labCount{font-size:10.5px}
}
@media(max-width:350px){
 #toolbar{gap:2px;padding:3px 3px;min-height:49px}
 #toolbar > .pxbtn{height:33px;min-height:33px;font-size:10px;padding:3px 3px}
 #toolbar #townBtn{padding:3px 3px}
 #toolbar #events{font-size:10px}
 #zoomStack{flex-basis:26px;width:26px}
 #crowdLab{flex-basis:90px;min-width:78px;padding-left:4px}
 #crowdLabToggle .labTop{font-size:10px}
 #crowdLabToggle .labCount{font-size:10px}
}

</style>
</head>
<body>
<canvas id="game" aria-label="Interactive pixel-art autonomous neighborhood"></canvas>
<div id="vignette"></div>
<div class="hud" id="header"><div class="brand">🌱 LITTLE <span>LIVES</span></div><div id="clock">MON · <strong>08:00 AM</strong> · Day 0</div></div>
<div class="hud" id="minimapBox"><canvas id="minimap" width="216" height="156" aria-label="Tap minimap to move camera"></canvas><div id="mapCaption">WILLOWBROOK TOWN</div></div>
<div id="sceneTag">⛲ Lantern Square</div><div id="hint">Drag to explore · Watch the plaza · ◉ Live for activities</div><div id="notice"></div><div id="saveFlash" role="status" aria-live="polite" aria-atomic="true"></div>
<div class="hud" id="toolbar">
<button id="townBtn" class="pxbtn green" title="Show the whole town">▦ All</button>
<div class="sep"></div>
<div id="zoomStack" aria-label="Zoom controls"><button class="pxbtn small" id="plus" title="Zoom in">+</button><button class="pxbtn small" id="minus" title="Zoom out">−</button></div>
<div class="sep"></div>
<button class="pxbtn active" id="play" title="Pause or resume">▶</button><button class="pxbtn" id="speed" title="Change speed">1×</button>
<div class="sep"></div>
<button class="pxbtn small" id="people" title="Residents">👥</button><button class="pxbtn small" id="events" title="Live activity and events">◉ Live</button><button class="pxbtn small" id="nextMoment" title="Jump to the next interesting moment">⏭</button>
<div id="crowdLab" class="compact" aria-label="Crowd Lab test controls">
 <button id="crowdLabToggle" type="button" aria-expanded="false" aria-controls="crowdLabControls"><span class="labTop">🧪 Crowd Lab <span class="labChevron" aria-hidden="true">▾</span></span><span class="labCount"><span id="crowdLabLabel">1,000</span> residents</span></button>
 <div id="crowdLabControls">
  <div id="crowdLabPanelHeader"><strong>New test population</strong><button id="crowdLabCollapse" type="button" aria-label="Collapse Crowd Lab panel" title="Collapse Crowd Lab">▾ Hide</button></div>
  <div id="crowdLabOptions"></div>
  <div id="crowdLabActionRow"><button id="crowdLabFindCrowd" type="button" title="Move the camera to the densest outdoor group">🔎 Watch busiest street</button><button id="crowdLabNuke" type="button" title="Wipe all four Crowd Lab population saves">☢️ Nuke saves</button></div>
  <div id="crowdLabMetrics">Starting simulation…</div>
 </div>
</div>
</div>
<div id="eventToast">The neighborhood is waking up…</div>
<div id="sheet" role="dialog" aria-label="Little Lives information panel"></div>
<script>
'use strict';
// Little Lives v0.8.3.1.1c CROWD LAB BETA; offline, save schema unchanged.
// All art is drawn in Canvas: no external files, frameworks or licensed assets required.
// MW/MH describe the 3x3 PLANNED town footprint, not limits of the infinite world.
const CROWD_LAB_PRESETS=[250,500,1000,2000];
const CROWD_LAB_QUERY=Number(new URLSearchParams(location.search).get('population'));
const CROWD_LAB_POPULATION=CROWD_LAB_PRESETS.includes(CROWD_LAB_QUERY)?CROWD_LAB_QUERY:2000;
// These keys are deliberately different from all official and earlier experimental saves.
const CROWD_LAB_SAVE_PREFIX='little-lives-v083111a-crowdlab-';
const CROWD_LAB_SAVE_KEY=CROWD_LAB_SAVE_PREFIX+CROWD_LAB_POPULATION;
const TILE=32, MW=192, MH=192, IW=18, IH=13, SAVE=CROWD_LAB_SAVE_KEY;
const WORLD_CHUNK=64, WORLD_SEED=702;
const WORLD_CHUNK_AREA=WORLD_CHUNK*WORLD_CHUNK;
// Geographic mip sizes double with each tier. Only visual fidelity varies; the world and citizens do not.

function parkObservationSnapshot(){
 const counts={total:0,jogging:0,socializing:0,walking:0,waiting:0,other:0,onTrail:0};
 for(const n of residents){
  if(n.place!=='town'||n.visitor&&!n.active||
     n.x<PARK_BOUNDS.left||n.x>PARK_BOUNDS.right||
     n.y<PARK_BOUNDS.top||n.y>PARK_BOUNDS.bottom)continue;
  counts.total++;
  if(parkTrail(Math.round(n.x),Math.round(n.y)))counts.onTrail++;
  if(n.phase==='path-wait'||n.phase==='portal-wait'||n.phase==='gather-wait'||
     (n.route?.length&&(n.delay||0)>=1.6))counts.waiting++;
  else if(n._microId||n.task?.kind==='social'||n.phase==='seek')counts.socializing++;
  else if(n.phase==='jogging'&&n.task?.kind==='jog')counts.jogging++;
  else if(n.route?.length)counts.walking++;
  else counts.other++;
 }
 return counts;
}

function parkJogRouteAudit(){

 for(let i=0;i<jogLoop.length;i++){
  const a=jogLoop[i],b=jogLoop[(i+1)%jogLoop.length];
  const dx=Math.sign(b.x-a.x),dy=Math.sign(b.y-a.y);
  if(Math.abs(dx)+Math.abs(dy)!==1)throw new Error('Non-cardinal park jogging leg '+i);
  const length=Math.abs(b.x-a.x)+Math.abs(b.y-a.y);legs.push(length);
  for(let j=0;j<=length;j++){
   const x=a.x+dx*j,y=a.y+dy*j;
   if(!parkTrail(x,y))offTrail.push([x,y]);
   if(blocked(x,y,'town'))solid.push([x,y]);
  }
 }
 return {legs,offTrail,solid,waypoints:jogLoop.map(p=>({...p}))};
}

  const overlap=e.people.filter(id=>knowsIdentity(listener,residents[id])&&e.identified.includes(id)).length;
  const shared=e.people.includes(listener.id);

 else if(e.kind==='adventure')opener=`I went on an adventure with ${names} ${when}.`;
 else if(e.kind==='outing')opener=`I saw ${names} out together ${where} ${when}. They seemed busy.`;

 else opener=`I saw ${names} talking ${where} ${when}.`;

// One retelling beyond a firsthand witness is enough for small-world gossip.

function reportTopic(speaker,listener){

 const options=(speaker.heardReports||[]).map(reportView).filter(r=>r&&
  (r.depth||1)===1&&dayMinutes-(r.heardAt||r.when)<(r.kind==='outing'||r.kind==='adventure-end'?25000:8500)&&
  !told.some(t=>t.id===r.eventId&&t.to===listener.id&&dayMinutes-t.when<2000));
 const ranked=options.map(r=>{
  const overlap=r.identified.filter(id=>knowsIdentity(listener,residents[id])).length;
  const notable=r.kind==='outing'||r.kind==='adventure'||r.kind==='adventure-end';
  return {r,overlap,notable,score:(notable?42:9)+overlap*8};

         (n.x===4||n.x===5)&&n.y===4)target=furnitureSlots.get(place+':sofa-sleep');
 else if(kind==='work'&&place==='studio'&&/studio:computer-[0-3]/.test(id)){

   ['typing','paperwork','review','desk','reading'].includes(n.task.subAct))target=slot;

// Hot data changes continuously. Every save also checkpoints a rotating group
// without examining or serializing every citizen. Important events mark their
// participants dirty immediately; small worlds checkpoint everyone.
function checkpointCitizenIds(){const ids=new Set();
 const count=residents.length;
 const budget=count<=160?count:Math.max(128,Math.min(512,Math.round(count*.045)));
 // Prioritize urgent changes, but bound the amount of work per transaction.
 for(const id of dirtyCitizens){ids.add(id);if(ids.size>=budget)break;}
 const rotating=Math.min(count,Math.max(count<=160?count:32,Math.floor(budget*.3)));
 for(let i=0;i<rotating&&ids.size<budget;i++){ids.add(checkpointCursor%count);checkpointCursor++;}
 return ids;
}

  if(dx*dx+dy*dy>r*r+1)continue;

  if(blocked(x,y,'town')||admissionProtected(b,x,y))continue;

  // through static geometry, never across the whole simulation.

function admissionTraceWeight(b,spot){

function admissionApproach(n){

function admissionService(){
 // Event-driven roster of active destinations, not a scan of all citizens.

   s.entries.delete(who);if(n?._admissionEntry===id)n._admissionEntry=null;admissionStats.expired++;

    if(n){releaseGatherClaim(n);n._gatherBuilding=null;}

   // Gathering and temporary maneuver claims are distinct. Never steal an
   // active sidestep's claim by calling reserveTile during admission service.
   const reservedBy=reservationOwner('town',w.spot.x,w.spot.y);
   if(reservedBy!==who){
    if(n.yieldState)continue; // Let the real maneuver finish before repairing.

   // ordinary commitment precedence, not a new wait-aging or need scheduler.

function admissionCrowdFor(n){return n?._gatherBuilding?admissionStates.get(n._gatherBuilding):null;}
function admissionSocialFactor(a,b){

const cafeQueueOwners=new Map();

 const other=residents[partnerId];if(!other||n.place!==place||other.place!==place||
   other.visitor&&!other.active)return false;

}

 if(delay===0)n.bubble={text,until:now+duration,partnerId,originPlace:n.place,maxDist};

function residentStatusFacts(n){

  wait:n.phase==='path-wait'?(n.pathWait?.reason||'queued route request'):
   n.phase==='portal-wait'?(physicallyAtInteriorExit(n)?'exterior doorway landing unavailable':'interior exit or route currently obstructed'):
   n.phase==='gather-wait'?'waiting for admission':
   n.phase==='gather-move'?'walking to an outdoor waiting place':

   'The route finder reported: '+why.replace(/-/g,' ')+'.';

 if(n.phase==='portal-wait')return physicallyAtInteriorExit(n)?

// Portable backups are v5 snapshots. We validate before touching the active save,
// and the IndexedDB replacement happens in ONE readwrite transaction.
function validateBackup(data){
 if(!data||typeof data!=='object'||Array.isArray(data)||data.version!==5)
  throw new Error('Expected a Little Lives version-5 JSON backup');
 if(!Number.isFinite(data.minutes)||data.minutes<0)
  throw new Error('Backup is missing a valid world clock');
 if(!data.world||data.world.schema!==1||data.world.chunkSize!==WORLD_CHUNK||
    !Array.isArray(data.world.changes))throw new Error('Backup world geometry is incompatible');
 const people=data.people;
 if(!Array.isArray(people)||people.length<PERMANENT||people.length>100000)
  throw new Error('Backup has an invalid resident roster');
 for(let i=0;i<people.length;i++){
  const n=people[i];if(!n||typeof n!=='object'||n.id!==i||typeof n.name!=='string'||
   !Number.isFinite(n.x)||!Number.isFinite(n.y)||typeof n.place!=='string')
   throw new Error('Invalid resident record at index '+i);
 }
 if(!Array.isArray(data.adventures||[])||!Array.isArray(data.games||[])||
  !Array.isArray(data.socialEvents||[]))throw new Error('Backup activities or event facts are malformed');
 if(data.socialEvents?.some(f=>!f||typeof f.id!=='string'||!Array.isArray(f.people)||!Number.isFinite(f.when)))
  throw new Error('Backup has invalid social-event facts');
 for(const chunk of data.world.changes){
  if(!Array.isArray(chunk)||chunk.length!==3||!Number.isSafeInteger(chunk[0])||
   !Number.isSafeInteger(chunk[1])||!Array.isArray(chunk[2]))
   throw new Error('Invalid edited-world chunk');
  for(const row of chunk[2])if(!Array.isArray(row)||row.length!==3||!Number.isInteger(row[0])||
   row[0]<0||row[0]>=WORLD_CHUNK_AREA)throw new Error('Invalid world-edit tile');
 }

}

function writeImportedDatabase(db,data){return new Promise((resolve,reject)=>{
 let tx;try{tx=db.transaction(IDB_STORES,'readwrite');}catch(e){reject(e);return;}
 try{
  for(const name of IDB_STORES)tx.objectStore(name).clear();
  for(const n of data.people)tx.objectStore('citizens').put(n);
  for(const fact of data.socialEvents||[])tx.objectStore('facts').put(fact);
  tx.objectStore('world').put(importedWorldRecord(data));
  tx.objectStore('activities').put(importedActivityRecord(data));
  tx.objectStore('meta').put({key:'current',schema:IDB_SCHEMA,peopleCount:data.people.length,
   committedAt:Date.now(),generation:saveState.writes+1});
 }catch(e){try{tx.abort();}catch(_){}reject(e);return;}

const FIXED_TICK=.05; // 20 simulation ticks/sec; independent of canvas frame rate.

   const tickAt=DEBUG?performance.now():0;advance(FIXED_TICK*speed);if(DEBUG)recordPerf('sim',performance.now()-tickAt);simAccumulator-=FIXED_TICK;
  }

  camera.x+=(tiles(n.x+.5)-camera.x)*Math.min(1,dt*6);

 }else lastFollowedPlace=null;

// v0.8 performance probe: opt-in, comparable across commits, no gameplay shortcuts.
// Instrument the real autonomous simulation and record inclusive wall time by subsystem.
const performanceAudit={enabled:false,samples:new Map(),originals:new Map(),startedAt:0,
 start(){if(this.enabled)return;this.enabled=true;this.startedAt=performance.now();
  for(const name of Object.keys(perfAuditWrappers))perfAuditWrappers[name]();},
 stop(){if(!this.enabled)return;this.enabled=false;for(const restore of this.originals.values())restore();this.originals.clear();},
 add(name,ms){let v=this.samples.get(name);if(!v){v={count:0,total:0,max:0,last:0};this.samples.set(name,v);}v.count++;v.total+=ms;v.last=ms;v.max=Math.max(v.max,ms);},
 report(){return {elapsedMs:performance.now()-this.startedAt,metrics:Object.fromEntries([...this.samples].map(([k,v])=>[k,{calls:v.count,totalMs:+v.total.toFixed(2),avgMs:+(v.total/v.count).toFixed(4),maxMs:+v.max.toFixed(2)}])),
  inhabitants:residents.length,active:residents.filter(n=>!n.visitor||n.active).length,
  spatial:engineStats.spatialRepairs,trafficRecovery:engineStats.watchdogRecoveries,
  routing:{requested:pathStats.requested,expanded:pathStats.expanded,completed:pathStats.completed,peakQueue:pathStats.peakQueue},
  nav:{nodes:sharedNavStats.nodes,edges:sharedNavStats.edges,trees:sharedNavStats.treeBuilds},
  persistence:{mode:saveState.mode,records:saveState.recordsWritten}};},
 reset(){this.samples.clear();this.startedAt=performance.now();}
};
function auditWrap(name,fn,setter){const base=fn;const wrapped=function(...args){const start=performance.now();try{return base.apply(this,args);}finally{performanceAudit.add(name,performance.now()-start);}};
 performanceAudit.originals.set(name,()=>setter(base));setter(wrapped);}
const perfAuditWrappers={
  sim:()=>auditWrap('sim',advance,f=>advance=f),
  decisions:()=>auditWrap('decisions',processLifeEvents,f=>processLifeEvents=f),
  routing:()=>auditWrap('routing',pumpPathQueue,f=>pumpPathQueue=f),

};

// Move only the CAMERA to the most crowded street block. No resident moves.
function crowdLabWatchBusiestStreet(announce=true){
 const bins=new Map();
 for(const n of residents){
  if(n.visitor||n.place!=='town')continue;
  const x=Math.floor(n.x/12),y=Math.floor(n.y/12),key=x+','+y;
  const block=bins.get(key)||{x,y,count:0};block.count++;bins.set(key,block);
 }
 let best=null;
 for(const bin of bins.values())if(!best||bin.count>best.count)best=bin;
 if(!best)return;
 if(scene!=='town')setScene('town');following=null;followingScene=null;
 camera.x=tiles(best.x*12+6);camera.y=tiles(best.y*12+6);boundCamera();
 lastTownCamera={...camera};
 if(announce)showNotice('Crowd Lab: '+best.count+' residents in this busy street block');
}
// Bounded, deliberately sampled outdoor observation. Not a shared omniscient
// map for residents: NO destination selection, path cost or movement reads it.
const betaCrowdSampling={lastAverage:null,lastAt:null,observations:0};
function sampleGeneralCrowdPressure(maxSamples=120){
 const stride=Math.max(1,Math.floor(CROWD_LAB_POPULATION/maxSamples));
 let outside=0,nearbyTotal=0,crowded=0,maxNeighbors=0,delayed=0;
 for(let i=0;i<residents.length;i+=stride){
  const n=residents[i];if(!n||n.visitor||n.place!=='town')continue;
  let nearby=0;
  for(const other of spatialNear('town',n.x,n.y,3.1)){
   if(other===n||other.visitor&&!other.active)continue;
   const dx=other.x-n.x,dy=other.y-n.y;
   if(dx*dx+dy*dy<=9)nearby++;
  }
  outside++;nearbyTotal+=nearby;maxNeighbors=Math.max(maxNeighbors,nearby);
  if(nearby>=6)crowded++;
  if((n.delay||0)>=1.6||n.phase==='path-wait')delayed++;
 }
 const average=outside?nearbyTotal/outside:0,prev=betaCrowdSampling.lastAverage;
 const elapsed=betaCrowdSampling.lastAt===null?Infinity:dayMinutes-betaCrowdSampling.lastAt;
 // Sample only at least 3 simulated minutes apart. Timeless UI updates never
 // constitute a rise or fall in actual crowd density.
 let trend='not established';
 if(prev!==null&&elapsed>=3){const delta=average-prev;
  trend=delta>.6?'rising':delta<-.6?'easing':'roughly stable';
 }
 if(elapsed>=3||prev===null){betaCrowdSampling.lastAverage=average;
  betaCrowdSampling.lastAt=dayMinutes;betaCrowdSampling.observations++;}
 return {outside,crowded,delayed,maxNeighbors,mean:average,trend,
  radiusTiles:3,crowdedThreshold:6,sampledUpTo:maxSamples};
}
// A destination can have room inside yet be difficult to approach. These
// numbers intentionally describe different resources; nobody chooses a new
// task because of this observer.
function buildingApproachSnapshot(top=3){
 const entries=[];let fullInside=0,heavyApproaches=0;
 for(const b of buildings){
  if(!ADMISSION_TYPES.has(b.type))continue;
  const inside=placeRosters.get(b.id)?.size||0,capacity=admissionCapacity(b);
  const state=admissionStates.get(b.id),tickets=state?.entries.size||0;
  let nearby=0;
  for(const n of spatialNear('town',b.cx,b.entryY,5)){
   if(n.visitor&&!n.active||n.place!=='town')continue;
   if(Math.hypot(n.x-b.cx,n.y-b.entryY)<=5)nearby++;
  }
  if(inside>=capacity)fullInside++;
  if(nearby>=8)heavyApproaches++;
  entries.push({id:b.id,name:b.name,inside,capacity,tickets,
   waiting:state?.waiters.size||0,nearby});
 }
 entries.sort((a,b)=>b.nearby-a.nearby||b.waiting-a.waiting||a.id.localeCompare(b.id));
 return {checked:entries.length,fullInside,heavyApproaches,
  busiest:entries.slice(0,top)};
}

   location.assign(base+'?population='+count);
  });options.appendChild(button);
 }
 const setCrowdPanelExpanded=(expanded)=>{
  $('crowdLab').classList.toggle('compact',!expanded);
  $('crowdLabToggle').setAttribute('aria-expanded',String(expanded));
  // On first opening, don't leave the expanded panel saying 'Starting…'
  // until the 1.65-second background cadence happens to fire.
  currentAt=-Infinity;refresh();
 };
 // Both buttons control exactly the same panel state; closing restores focus.
 $('crowdLabToggle').addEventListener('click',()=>
  setCrowdPanelExpanded($('crowdLab').classList.contains('compact')));
 $('crowdLabCollapse').addEventListener('click',()=>{
  setCrowdPanelExpanded(false);$('crowdLabToggle').focus();
 });
 let currentAt=0;
 function refresh(){
  if(performance.now()-currentAt<1600)return;
  currentAt=performance.now();
  let permanent=0,street=0,indoors=0,moving=0,blockedCount=0;
  for(const n of residents){
   if(n.visitor)continue;permanent++;
   if(n.place==='town')street++;else if(n.place!=='away')indoors++;
   if(n.route?.length)moving++;
   if(n.route?.length&&(n.stuck||0)>10)blockedCount++;
  }
  const summary=permanent.toLocaleString()+' permanent residents · '+street+' outside · '+indoors+
   ' inside · '+moving+' routing · '+blockedCount+' repeatedly blocked · '+
   engineStats.watchdogRecoveries+' watchdogs · '+pathQueueMetrics.live+' live queued paths';
  // Heavy diagnostics only while the panel is visible, never once per frame.
  if($('crowdLab').classList.contains('compact')){metrics.textContent=summary;return;}
  const pressure=sampleGeneralCrowdPressure(),park=parkObservationSnapshot(),
   approaches=buildingApproachSnapshot();
  metrics.innerHTML='<div>'+sanitize(summary)+'</div>'+ 
   '<div class="betaMetric"><b>Outdoor crowd sample</b>: '+pressure.crowded+'/'+pressure.outside+
   ' sampled have ≥6 neighbors within 3 tiles; mean '+pressure.mean.toFixed(1)+
   ' · '+sanitize(pressure.trend)+'. '+pressure.delayed+' sampled delayed.</div>'+ 
   '<div class="betaMetric"><b>Park</b>: '+park.total+' present; '+park.jogging+
   ' jogging, '+park.socializing+' socializing, '+park.waiting+' waiting, '+park.walking+
   ' walking, '+park.other+' other.</div>'+ 
   '<div class="betaMetric"><b>Building pressure</b>: '+approaches.fullInside+'/'+
   approaches.checked+' capacity-full; '+approaches.heavyApproaches+
   ' have ≥8 residents nearby. <small>Nearby people may be passersby, not applicants.</small></div>'+ 
   approaches.busiest.map(v=>'<div class="betaMetric">'+sanitize(v.name)+': '+v.nearby+
   ' nearby · '+v.inside+'/'+v.capacity+' inside · '+v.waiting+' queued · '+v.tickets+
   ' admission tickets</div>').join('')+
   '<div class="betaMetric"><small>Read-only samples, not automatic crowd avoidance.</small></div>';
 }
 setInterval(refresh,1650);refresh();
}
